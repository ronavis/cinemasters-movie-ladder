name: Identity Service Smoke Test

on:
  push:
    paths:
      - ".github/workflows/identity-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        run: |
          set -euo pipefail
          curl -fsS https://midconversation.com/arcade-api/health | tee /tmp/health.json
          grep -q '"status"' /tmp/health.json

      - name: Check Google client configuration
        run: |
          set -euo pipefail
          curl -fsS https://midconversation.com/arcade-api/config | tee /tmp/config.json
          grep -q '569822322277-ng39tk1vcecgjfes85bs16umb5k47mc7.apps.googleusercontent.com' /tmp/config.json

      - name: Check GitHub Pages CORS
        run: |
          set -euo pipefail
          curl -fsSI -H 'Origin: https://ronavis.github.io' https://midconversation.com/arcade-api/health | tee /tmp/headers.txt
          grep -qi '^access-control-allow-origin: https://ronavis.github.io' /tmp/headers.txt

      - name: Check live TMDb poster
        run: |
          set -euo pipefail
          curl -fsS 'https://midconversation.com/arcade-api/movie-ladder/tmdb/search?title=Jaws&year=1975' | tee /tmp/jaws.json
          POSTER="$(python3 -c "import json; p=json.load(open('/tmp/jaws.json')).get('poster'); assert p, 'No poster URL returned'; print(p)")"
          echo "Poster URL: $POSTER"
          curl -fsS --max-time 20 -o /tmp/jaws-poster.jpg "$POSTER"
          test -s /tmp/jaws-poster.jpg

      - name: Check live actor profile
        run: |
          set -euo pipefail
          curl -fsS 'https://midconversation.com/arcade-api/movie-ladder/tmdb/person?name=Harrison%20Ford' | tee /tmp/person.json
          PROFILE="$(python3 -c "import json; p=json.load(open('/tmp/person.json')).get('profile'); assert p, 'No profile URL returned'; print(p)")"
          echo "Profile URL: $PROFILE"
          curl -fsS --max-time 20 -o /tmp/harrison.jpg "$PROFILE"
          test -s /tmp/harrison.jpg
